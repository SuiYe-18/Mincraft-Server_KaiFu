<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC全版本开服面板 | 1.0.0-26.1.2</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="layout">
<div class="sidebar">
<div class="logo">MC开服面板</div>
<div class="menu-item active">控制台</div>
<div class="menu-item">玩家管理</div>
<div class="menu-item">封禁列表</div>
<div class="menu-item">反作弊</div>
<div class="menu-item">版本管理</div>
</div>
<div class="main">
<div class="top-bar">
<span>状态：<span id="state" class="off">离线</span></span>
<span>运行时长：<span id="uptime">00:00:00</span></span>
</div>
<div class="cards">
<div class="card">在线<span id="on">0</span></div>
<div class="card">离线<span id="off">0</span></div>
<div class="card">总玩家<span id="total">0</span></div>
<div class="card">封禁<span id="ban">0</span></div>
</div>
<div class="btns">
<button id="start">启动服务器</button>
<button id="stop">关闭服务器</button>
<button id="porton">端口映射开启</button>
<button id="portoff">端口映射关闭</button>
</div>
<div class="info">
本地IP：<span id="localip">读取中...</span><br>
服务器名：<input id="sname"><br>
介绍：<textarea id="desc"></textarea><br>
种子：<input id="seed"><br>
头像：<input type="file" id="avatar">
</div>
<div class="version">
版本选择：<select id="ver"></select>
<button id="download">下载当前版本Jar</button>
<button id="localjar">手动选择Jar</button>
<div id="jarstatus"></div>
</div>
<div class="console">
日志：<div id="log"></div>
<input id="cmd" placeholder="输入指令">
<button id="send">发送</button>
</div>
<div class="banlist">
封禁列表：<div id="banbox"></div>
<input id="p" placeholder="玩家">
<input id="r" placeholder="原因">
<button id="doban">封禁</button>
<button id="unban">解封</button>
</div>
</div>
</div>
<script src="js/app.js"></script>
</body>
</html>
